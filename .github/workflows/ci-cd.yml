# CI/CD for the Smart Gmail Assistant.
#
# The repo holds three deployables that move together but ship differently:
#   gmail-dashboard/     -> Next.js app on Vercel
#   supabase/migrations/ -> schema, pushed with the Supabase CLI
#   n8n/workflows/       -> workflow JSON, imported into n8n by hand
#
# Every push and PR runs the three verification jobs. Deploys only happen from
# main, only after all three are green, and the schema is pushed *before* the
# app that queries it.
name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-cd-${{ github.ref }}
  # Superseded PR runs are wasted work, but cancelling a half-finished
  # production deploy is worse than letting it finish.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  NODE_VERSION: "22"

jobs:
  dashboard:
    name: Dashboard (lint, types, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: gmail-dashboard
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: gmail-dashboard/package-lock.json

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npx tsc --noEmit

      # No secrets here on purpose: every env var is read lazily at request
      # time (lib/supabase/server.ts, lib/auth/session.ts), so a build that
      # needs a secret means something started reading env at module scope.
      - name: Build
        run: npm run build

  migrations:
    name: Supabase migrations
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The already-merged-migration check diffs against the base branch.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Check naming, ordering and immutability
        run: node scripts/ci/check-migrations.mjs ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || '' }}

  n8n:
    name: n8n workflows
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Validate workflow exports
        run: node scripts/ci/check-n8n-workflows.mjs

  preview:
    name: Deploy preview
    needs: [dashboard, migrations, n8n]
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: preview
      url: ${{ steps.deploy.outputs.url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - run: npm install --global vercel@latest

      # `vercel pull` writes the project settings (including the
      # gmail-dashboard root directory) and preview env vars into .vercel/,
      # so `vercel build` reproduces what Vercel itself would build.
      - name: Pull Vercel environment
        run: vercel pull --yes --environment=preview --token="$VERCEL_TOKEN"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Build
        run: vercel build --token="$VERCEL_TOKEN"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Deploy
        id: deploy
        run: echo "url=$(vercel deploy --prebuilt --token="$VERCEL_TOKEN")" >> "$GITHUB_OUTPUT"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Summarise
        run: |
          echo "Preview: ${{ steps.deploy.outputs.url }}" >> "$GITHUB_STEP_SUMMARY"

  migrate:
    name: Push schema to Supabase
    needs: [dashboard, migrations, n8n]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      # Migrations are additive and forward-only (the migrations job rejects
      # edits to merged files), so this runs before the app deploy: new schema
      # under old code is safe, the reverse is not.
      - name: supabase db push
        run: |
          supabase link --project-ref "$SUPABASE_PROJECT_REF"
          supabase db push
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}

  production:
    name: Deploy production
    needs: [migrate]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ steps.deploy.outputs.url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - run: npm install --global vercel@latest

      - name: Pull Vercel environment
        run: vercel pull --yes --environment=production --token="$VERCEL_TOKEN"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Build
        run: vercel build --prod --token="$VERCEL_TOKEN"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Deploy
        id: deploy
        run: echo "url=$(vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN")" >> "$GITHUB_OUTPUT"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      # A deploy that returns 200 on /login proves the bundle boots and the
      # middleware runs; anything deeper needs a session and real data.
      - name: Smoke-test the deployment
        run: |
          for attempt in 1 2 3 4 5; do
            status=$(curl -s -o /dev/null -w '%{http_code}' "${{ steps.deploy.outputs.url }}/login") && \
              [ "$status" = "200" ] && echo "OK ($status)" && exit 0
            echo "attempt $attempt: got ${status:-no response}, retrying"
            sleep 5
          done
          echo "::error::/login did not return 200 after the deploy"
          exit 1

      - name: Summarise
        run: |
          echo "Production: ${{ steps.deploy.outputs.url }}" >> "$GITHUB_STEP_SUMMARY"
